name: Update duty data

on:
  workflow_dispatch:
  push:
    paths:
      - "data-source/*.xlsx"
      - "scripts/extract_public_data.py"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract public rule data
        run: python scripts/extract_public_data.py

      - name: Run rule tests
        run: npm test

      - name: Commit generated data
        run: |
          if git diff --quiet public/data/rules.json public/data/summary.json; then
            echo "No generated data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/rules.json public/data/summary.json
          git commit -m "Update duty data from source workbook"
          git push
